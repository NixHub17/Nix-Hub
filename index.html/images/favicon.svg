<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4545" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#700000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="#050505"/>
  <circle cx="96" cy="96" r="76" fill="url(#glow)" filter="url(#softGlow)"/>
  <rect x="36" y="36" width="120" height="120" rx="26" fill="rgba(255,255,255,0.08)"/>
  <image href="site-photo.png" x="40" y="40" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>
</svg>
